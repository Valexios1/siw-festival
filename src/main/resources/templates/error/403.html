<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Siw Festival - Accesso negato</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1>403 - Accesso negato</h1>

    <p class="error-msg" th:if="${messaggio != null}" th:text="${messaggio}">Messaggio di errore</p>
    <p th:unless="${messaggio != null}">Non hai i permessi necessari per accedere a questa risorsa.</p>

    <a class="btn-back" th:href="@{/}">&larr; Torna alla home</a>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
