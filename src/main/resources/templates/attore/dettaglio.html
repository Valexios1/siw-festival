<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="'Siw Festival - ' + ${attore.nome} + ' ' + ${attore.cognome}">Siw Festival - Attore</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <a class="btn-back" th:href="@{/attori}">&larr; Torna agli attori</a>

    <div class="dettaglio">
        <h1 th:text="${attore.nome + ' ' + attore.cognome}">Nome Cognome</h1>

        <div class="dettaglio-info">
            <div class="dettaglio-blocco">
                <h3>Informazioni</h3>
                <ul>
                    <li>
                        <strong>Nome:</strong>
                        <span th:text="${attore.nome}">Nome</span>
                    </li>
                    <li>
                        <strong>Cognome:</strong>
                        <span th:text="${attore.cognome}">Cognome</span>
                    </li>
                    <li>
                        <strong>Data di nascita:</strong>
                        <span th:text="${attore.dataNascita != null ? #temporals.format(attore.dataNascita, 'dd/MM/yyyy') : 'n/d'}">01/01/1924</span>
                    </li>
                    <li>
                        <strong>Nazionalità:</strong>
                        <span th:text="${attore.nazionalita}">Italiana</span>
                    </li>
                </ul>
            </div>

            <div class="dettaglio-blocco" th:if="${isAdmin}">
                <h3>Amministrazione</h3>
                <a class="btn" th:href="@{/admin/attore/{id}/modifica(id=${attore.id})}">Modifica attore</a>
            </div>
        </div>

        <h2>Filmografia</h2>
        <p th:if="${#lists.isEmpty(interpretazioni)}">Nessuna interpretazione registrata.</p>

        <table class="tabella" th:unless="${#lists.isEmpty(interpretazioni)}">
            <thead>
            <tr>
                <th>Film</th>
                <th>Personaggio</th>
                <th>Anno</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="i : ${interpretazioni}">
                <td th:text="${i.film != null ? i.film.titolo : 'n/d'}">Titolo</td>
                <td th:text="${i.personaggio}">Personaggio</td>
                <td th:text="${i.film != null && i.film.anno != null ? i.film.anno : 'n/d'}">1972</td>
                <td>
                    <a class="btn" th:if="${i.film != null}" th:href="@{/film/{id}(id=${i.film.id})}">Vai al film</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
