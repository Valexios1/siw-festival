<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Siw Festival - Festival</title>
    <link rel="stylesheet" href="/css/stile.css" />
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1>Festival</h1>

    <div class="success-msg" th:if="${successo != null}" th:text="${successo}">Operazione completata</div>
    <div class="error-msg" th:if="${errore != null}" th:text="${errore}">Errore</div>

    <p th:if="${isAdmin}">
        <a class="btn" th:href="@{/admin/festival/nuovo}">Nuovo festival</a>
    </p>

    <p th:if="${#lists.isEmpty(festival)}">Nessun festival registrato.</p>

    <div class="griglia-card" th:unless="${#lists.isEmpty(festival)}">
        <div class="card" th:each="f : ${festival}">
            <h2 th:text="${f.nome}">Nome festival</h2>
            <ul class="lista-info">
                <li>
                    <strong>Anno:</strong>
                    <span th:text="${f.anno}">2026</span>
                </li>
                <li>
                    <strong>Città:</strong>
                    <span th:text="${f.citta}">Roma</span>
                </li>
                <li>
                    <strong>Date:</strong>
                    <span th:text="${f.dataInizio != null ? #temporals.format(f.dataInizio, 'dd/MM/yyyy') : 'n/d'}">01/11/2026</span>
                    &ndash;
                    <span th:text="${f.dataFine != null ? #temporals.format(f.dataFine, 'dd/MM/yyyy') : 'n/d'}">10/11/2026</span>
                </li>
            </ul>
            <a class="btn" th:href="@{/festival/{id}(id=${f.id})}">Dettaglio</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
