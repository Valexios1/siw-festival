<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Siw Festival - Film</title>
    <link rel="stylesheet" href="/css/stile.css" />
    <link rel="stylesheet" href="/css/film-widget.css" />
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1>Film</h1>

    <div class="success-msg" th:if="${successo != null}" th:text="${successo}">Operazione completata</div>
    <div class="error-msg" th:if="${errore != null}" th:text="${errore}">Errore</div>

    <p th:if="${isAdmin}">
        <a class="btn" th:href="@{/admin/film/nuovo}">Nuovo film</a>
    </p>

    <div id="film-list-root"></div>
</main>

<script type="module" src="/js/film-widget/film-widget.js"></script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
