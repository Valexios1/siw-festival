<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Siw Festival - Gestione recensioni</title>
    <link rel="stylesheet" href="/css/stile.css" />
    <link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin">
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <a class="btn-back" th:href="@{/admin}">&larr; Torna al pannello admin</a>

    <h1>Recensioni</h1>

    <div class="success-msg" th:if="${successo != null}" th:text="${successo}">Operazione completata</div>
    <div class="error-msg" th:if="${errore != null}" th:text="${errore}">Errore</div>

    <p th:if="${#lists.isEmpty(recensioni)}">Non ci sono recensioni da moderare.</p>

    <div class="griglia-card" th:unless="${#lists.isEmpty(recensioni)}">
        <div class="card" th:each="r : ${recensioni}">
            <span class="stelle">
                <span th:each="i : ${#numbers.sequence(1, 5)}"
                      th:classappend="${i <= r.voto ? '' : 'vuota'}"
                      th:text="${i <= r.voto ? '★' : '☆'}">★</span>
            </span>
            <p class="recensione-testo" th:text="${r.testo}">Testo della recensione</p>
            <p class="recensione-autore">
                <span th:text="${r.utente != null ? r.utente.name + ' ' + r.utente.surname : 'Utente'}">Autore</span>
                su <a th:href="@{/film/{id}(id=${r.film.id})}" th:text="${r.film.titolo}">Film</a>
                &middot;
                <span th:text="${r.dataCreazione != null ? #temporals.format(r.dataCreazione, 'dd/MM/yyyy HH:mm') : 'n/d'}">01/11/2026</span>
            </p>

            <form th:action="@{/recensioni/{id}/elimina(id=${r.id})}" method="post" class="inline-form"
                  onsubmit="return confirm('Eliminare questa recensione?');">
                <input type="hidden" name="admin" value="true" />
                <button type="submit" class="btn btn-danger">Elimina</button>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
